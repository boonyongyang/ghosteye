plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def requiredSigningKeys = ["keyAlias", "keyPassword", "storeFile", "storePassword"]
def hasCompleteReleaseSigning = keystorePropertiesFile.exists() &&
    requiredSigningKeys.every { key -> keystoreProperties.getProperty(key)?.trim() }

android {
    namespace = "com.boonyongyang.ghosteye"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.boonyongyang.ghosteye"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (hasCompleteReleaseSigning) {
                keyAlias = keystoreProperties.getProperty("keyAlias")
                keyPassword = keystoreProperties.getProperty("keyPassword")
                storeFile = file(keystoreProperties.getProperty("storeFile"))
                storePassword = keystoreProperties.getProperty("storePassword")
            }
        }
    }

    buildTypes {
        release {
            if (hasCompleteReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

flutter {
    source = "../.."
}

tasks.whenTaskAdded { task ->
    if ((task.name == "assembleRelease" || task.name == "bundleRelease") && !hasCompleteReleaseSigning) {
        task.doFirst {
            throw new GradleException(
                "Incomplete Android release signing. Copy android/key.properties.example, " +
                "fill all four signing values, point storeFile at your production keystore, " +
                "and keep both files out of git."
            )
        }
    }
}
